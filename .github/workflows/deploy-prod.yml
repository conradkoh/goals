name: Production Deployment

# Master pipeline. Deploys the Convex backend, and publishes goals-cli to npm when its version is
# newer than npm's. The filename of this workflow is registered with npm trusted publishing: never
# rename it.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-prod.yml'
      - 'services/backend/**'
      - 'packages/cli/**'
      - 'packages/shared/src/utilities/quarterly-markdown/**'
      - 'packages/shared/src/utilities/cli-contract/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    # workflow_dispatch can start this job from any branch; the production key only deploys master.
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Deploy Backend to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: pnpm --filter @workspace/backend run deploy

      - name: Run migrations
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: pnpm --filter @workspace/backend run migrate

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint packages/cli packages/shared/src/utilities
      - name: Test shared utilities
        run: pnpm --filter @workspace/shared test
      - name: Typecheck CLI
        run: pnpm --filter goals-cli typecheck
      - name: Test CLI
        run: pnpm --filter goals-cli test
      - name: Build CLI
        run: pnpm --filter goals-cli build

  check_version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the version currently on npm
        id: npm
        shell: bash
        run: |
          set -uo pipefail
          err_file="$RUNNER_TEMP/npm-view.err"
          registry=https://registry.npmjs.org
          if npm_version=$(npm view goals-cli version --registry="$registry" 2>"$err_file"); then
            echo "npm has goals-cli $npm_version"
          elif grep -qE 'E404|404 Not Found' "$err_file"; then
            npm_version='0.0.0'
            echo "goals-cli is not on npm yet; treating the published version as $npm_version"
          else
            echo '::error::npm view failed for a reason other than "package not found"'
            cat "$err_file" >&2
            exit 1
          fi
          # `latest` ignores prereleases published under another dist-tag (e.g. `next`), so also
          # look up the exact local version: if it is already on npm, publishing it again would fail.
          local_version=$(node -p "require('./packages/cli/package.json').version")
          lookup_version="${local_version%%+*}"
          if exact=$(npm view "goals-cli@$lookup_version" version --registry="$registry" 2>"$err_file"); then
            if [ -n "$exact" ]; then
              echo "goals-cli $lookup_version is already published on npm; nothing to publish"
              npm_version="$local_version"
            fi
          elif grep -qE 'E404|404 Not Found' "$err_file"; then
            echo "goals-cli $lookup_version is not on npm yet"
          else
            echo '::error::npm view failed for a reason other than "version not found"'
            cat "$err_file" >&2
            exit 1
          fi
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
      - name: Compare with the local version
        id: gate
        env:
          LOCAL_PACKAGE: packages/cli/package.json
          NPM_VERSION: ${{ steps.npm.outputs.npm_version }}
        run: node packages/cli/scripts/version-gate.mjs

  publish:
    needs: [verify, check_version]
    if: needs.check_version.outputs.should_publish == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm --filter goals-cli build
      - name: Require npm 11.5.1 or newer (trusted publishing)
        run: |
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is too old for trusted publishing; need >= 11.5.1`); process.exit(1); }
            console.log(`npm ${process.argv[1]} is new enough`);
          ' "$(npm --version)"
      - name: Pack
        id: pack
        env:
          VERSION: ${{ needs.check_version.outputs.version }}
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/goals-cli-pack"
          rm -rf "$out_dir" && mkdir -p "$out_dir"
          npm pack ./packages/cli --ignore-scripts --pack-destination "$out_dir"
          tarball="$out_dir/goals-cli-$VERSION.tgz"
          test -f "$tarball" || { echo "::error::expected $tarball was not produced"; ls -la "$out_dir"; exit 1; }
          listing=$(tar -tzf "$tarball")
          echo "$listing"
          echo "$listing" | grep -qx 'package/dist/cli.js' || { echo '::error::tarball is missing dist/cli.js'; exit 1; }
          echo "$listing" | grep -qx 'package/skills/goals-cli/SKILL.md' || { echo '::error::tarball is missing skills/goals-cli/SKILL.md'; exit 1; }
          if echo "$listing" | grep -q '^package/src/'; then echo '::error::tarball must not contain src/'; exit 1; fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ needs.check_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # A prerelease (e.g. 0.2.0-beta.1) must never become `latest`. Build metadata (+...) is
          # not a prerelease marker, so strip it before testing for a `-`.
          core="${VERSION%%+*}"
          if [[ "$core" == *-* ]]; then tag=next; else tag=latest; fi
          echo "Publishing $VERSION with dist-tag $tag"
          npm publish "$TARBALL" --access public --ignore-scripts --tag "$tag"
